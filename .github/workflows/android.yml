name: Build ALAM Voice ZIP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ALAM_Voice_Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          test -f ALAM_Voice_Project.zip || {
            echo "ALAM_Voice_Project.zip not found"
            exit 1
          }
          mkdir -p extracted
          unzip -q ALAM_Voice_Project.zip -d extracted
          test -f extracted/settings.gradle.kts || {
            echo "Invalid project ZIP structure"
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: extracted
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALAM-AI-Voice-Studio-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
