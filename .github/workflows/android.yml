name: Build ALAM Voice ZIP APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ALAM_Voice_Project.zip'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          test -f ALAM_Voice_Project.zip || { echo 'Upload ALAM_Voice_Project.zip to repository root'; exit 1; }
          mkdir -p extracted
          unzip -q ALAM_Voice_Project.zip -d extracted
          test -f extracted/settings.gradle.kts || { echo 'ZIP must contain project files at its root'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ALAM-AI-Voice-Studio-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
